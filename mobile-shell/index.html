<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Jersey Run</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #2c2e76;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap { text-align: center; color: #fff; }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 16px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      p { opacity: 0.8; font-size: 14px; }
    </style>
  </head>
  <body>
    <!--
      Cette page ne s'affiche qu'un très bref instant au lancement, le temps
      que Capacitor charge https://jerseyrun.re (voir capacitor.config.ts).
      Si elle reste visible, c'est que l'appareil n'a pas de connexion.
    -->
    <div class="wrap">
      <div class="spinner"></div>
      <p>Chargement de Jersey Run…</p>
    </div>
  </body>
</html>
